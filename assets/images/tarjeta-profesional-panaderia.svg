<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Tarjeta profesional de Andrés Felipe Gámez Caicedo - Dulce Tentación</title>
  <desc id="description">Tarjeta de panadería artesanal con logo, datos de contacto y foto de la tienda en una laptop.</desc>
  <style>
    @keyframes heartPulse { 0%, 100% { opacity: .68; translate: 0 0; } 50% { opacity: 1; translate: 0 -7px; } }
    @keyframes pastryGlow { 0%, 100% { filter: brightness(1); translate: 0 0; } 50% { filter: brightness(1.1); translate: 0 -4px; } }
    @keyframes frameGlow { 0%, 100% { stroke: #D48C29; } 50% { stroke: #E7CC98; } }
    @keyframes logoGlow { 0%, 100% { opacity: .82; stroke-width: 5; } 50% { opacity: 1; stroke-width: 7; } }
    @keyframes sparkle { 0%, 100% { opacity: .35; scale: .75; } 50% { opacity: 1; scale: 1.3; } }
    @keyframes wifiPulse { 0%, 100% { opacity: .28; } 50% { opacity: .72; } }
    .heart-decoration { animation: heartPulse 2.8s ease-in-out infinite; }
    .pastry-decoration { animation: pastryGlow 3.6s ease-in-out infinite; }
    .pastry-cake { animation-delay: -1.8s; }
    .laptop-frame { animation: frameGlow 3.2s ease-in-out infinite; }
    .logo-ring { animation: logoGlow 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .sparkle { animation: sparkle 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .sparkle-late { animation-delay: -1.1s; }
    .wifi-decoration { animation: wifiPulse 4s ease-in-out infinite; }
    .wifi-late { animation-delay: -2s; }
    @media (prefers-reduced-motion: reduce) {
      .heart-decoration, .pastry-decoration, .laptop-frame, .logo-ring, .sparkle, .wifi-decoration { animation: none; translate: none; scale: 1; }
    }
  </style>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#4A2C1D" flood-opacity=".16"/>
    </filter>
    <clipPath id="logo-clip">
      <circle cx="248" cy="315" r="174"/>
    </clipPath>
    <clipPath id="laptop-clip">
      <path d="M65 10H447C459 10 466 18 466 31V263L478 266C496 269 510 273 518 280L493 304C488 311 482 315 470 316H63C49 316 42 312 36 304L17 281C12 275 24 270 38 267L48 263V31C48 18 54 10 65 10Z"/>
    </clipPath>
    <g id="heart" fill="none" stroke="#D48C29" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 42 7 25C-5 12 12-5 24 9 36-5 53 12 41 25z"/>
    </g>
    <g id="wifi-mark" fill="none" stroke="#A86514" stroke-width="4" stroke-linecap="round">
      <path d="M4 14c18-18 46-18 64 0M15 25c12-12 30-12 42 0M26 36c6-6 14-6 20 0"/>
      <circle cx="36" cy="45" r="3" fill="#D48C29" stroke="none"/>
    </g>
  </defs>

  <rect width="1200" height="800" fill="#FAF6F0"/>
  <path d="M0 0h1200v18H0z" fill="#D48C29"/>
  <path d="M0 0h360C260 45 153 85 0 148z" fill="#E7CC98"/>
  <path d="M0 134C145 78 240 43 350 0" fill="none" stroke="#FFFFFF" stroke-width="5" opacity=".85"/>
  <path d="M910 800c104-46 197-82 290-92v92z" fill="#E7CC98"/>
  <path d="M982 800c68-34 137-60 218-71" fill="none" stroke="#FFFFFF" stroke-width="4" opacity=".8"/>
  <g>
    <use class="wifi-decoration" href="#wifi-mark" xlink:href="#wifi-mark" transform="translate(1090 50) scale(.82)"/>
    <use class="wifi-decoration wifi-late" href="#wifi-mark" xlink:href="#wifi-mark" transform="translate(1122 369) scale(.54)"/>
    <use class="wifi-decoration" href="#wifi-mark" xlink:href="#wifi-mark" transform="translate(24 181) scale(.44)"/>
  </g>

  <g filter="url(#shadow)">
    <circle class="logo-ring" cx="248" cy="315" r="190" fill="#FFFFFF" stroke="#D48C29" stroke-width="5"/>
    <image href="logo-tienda.jpg" xlink:href="logo-tienda.jpg" x="74" y="141" width="348" height="348" preserveAspectRatio="xMidYMid slice" clip-path="url(#logo-clip)"/>
  </g>

  <g opacity=".92">
    <use class="heart-decoration" href="#heart" xlink:href="#heart" transform="translate(66 527) scale(.8) rotate(-14 24 24)"/>
    <use class="heart-decoration" href="#heart" xlink:href="#heart" transform="translate(394 167) scale(.52) rotate(11 24 24)"/>
    <circle class="sparkle" cx="96" cy="483" r="5" fill="#D48C29"/>
    <circle class="sparkle sparkle-late" cx="415" cy="529" r="4" fill="#E7CC98"/>
    <path d="M103 575h290" stroke="#D8B77C" stroke-width="2"/>
    <text x="248" y="612" text-anchor="middle" fill="#A86514" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" letter-spacing="3">PANADERÍA ARTESANAL</text>
    <text x="248" y="644" text-anchor="middle" fill="#A86514" font-family="Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="2">DULCE TENTACIÓN</text>
    <ellipse cx="250" cy="716" rx="150" ry="12" fill="#E7CC98" opacity=".48"/>
    <g class="pastry-decoration" transform="translate(146 681) rotate(-8)" stroke="#A86514" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-47 28c2-22 20-37 48-37 27 0 44 15 46 37l-7 9h-80z" fill="#D48C29"/>
      <path d="m-21 4-8 17m30-23-8 19m30-11-7 16" fill="none" stroke="#FFF1D5" stroke-width="5"/>
    </g>
    <g class="pastry-decoration pastry-cake" transform="translate(325 676)" stroke="#A86514" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-43 5c7-18 20-27 43-27S36-13 43 5" fill="none" stroke="#D9534F" stroke-width="8"/>
      <path d="M-43 7h86l-10 40h-66z" fill="#E7CC98"/>
      <path d="M-33 20h66M-30 34h60" fill="none" stroke="#FFF8E9" stroke-width="5"/>
      <circle cx="0" cy="-21" r="7" fill="#D9534F"/>
      <path d="M1-28c1-9 8-11 13-10" fill="none" stroke="#A86514" stroke-width="3"/>
    </g>
    <text x="250" y="766" text-anchor="middle" fill="#A86514" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="3">HORNEADO CON AMOR</text>
  </g>

  <text x="492" y="105" fill="#A86514" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="4">PERFIL PROFESIONAL</text>
  <text x="488" y="190" fill="#2C2018" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" letter-spacing=".5">ANDRÉS FELIPE</text>
  <text x="488" y="258" fill="#D48C29" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700" letter-spacing=".3">GÁMEZ CAICEDO</text>

  <g transform="translate(490 291)">
    <rect width="350" height="54" rx="27" fill="#F3ECE1" stroke="#D8B77C" stroke-width="1.5"/>
    <g transform="translate(18 12)" fill="none" stroke="#A86514" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="26" height="19" rx="2"/>
      <path d="M-4 24h34l-4-5H0z"/>
    </g>
    <text x="60" y="35" fill="#A86514" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="1.4">TÉCNICO EN TICS</text>
  </g>
  <text x="490" y="382" fill="#A86514" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3">CONTACTO</text>
  <path d="M490 396h628" stroke="#D8B77C" stroke-width="1.5"/>
  <g transform="translate(494 430)" fill="none" stroke="#A86514" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="-14" width="30" height="22" rx="4"/>
    <path d="m2-11 13 10 13-10"/>
  </g>
  <text x="548" y="433" fill="#2C2018" font-family="Arial, sans-serif" font-size="22" font-weight="500">Dulcetentación@gmail.com</text>
  <g transform="translate(497 477)" fill="none" stroke="#A86514" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7-13c-2 0-5 3-5 6 0 9 11 20 20 20 3 0 6-3 6-5l-6-5-5 4c-3-1-7-5-8-8l4-5-6-7z"/>
  </g>
  <text x="548" y="480" fill="#2C2018" font-family="Arial, sans-serif" font-size="24" font-weight="700">310 573 1569</text>

  <g transform="translate(661 500) scale(.8542)" filter="url(#shadow)">
    <image href="laptop-dulce.jpg" xlink:href="laptop-dulce.jpg" x="0" y="0" width="535" height="335" preserveAspectRatio="none" clip-path="url(#laptop-clip)"/>
    <path class="laptop-frame" d="M65 10H447C459 10 466 18 466 31V263L478 266C496 269 510 273 518 280L493 304C488 311 482 315 470 316H63C49 316 42 312 36 304L17 281C12 275 24 270 38 267L48 263V31C48 18 54 10 65 10Z" fill="none" stroke="#D48C29" stroke-width="3"/>
  </g>
</svg>
