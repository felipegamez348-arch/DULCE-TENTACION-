  <text x="210" y="474" text-anchor="middle" fill="#c66b16" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" letter-spacing="1.1">DULCE TENTACIÓN</text>
  <path d="M126 493h168" stroke="#e5c9a9" stroke-width="1.5"/>
  <text x="210" y="520" text-anchor="middle" fill="#79543a" font-family="Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="2.2">PANADERÍA ARTESANAL</text>
