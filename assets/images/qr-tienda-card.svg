<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="420" height="580" viewBox="0 0 420 580" role="img" aria-labelledby="title description">
  <title id="title">Código QR de Dulce Tentación</title>
