      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#4b2b18" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="420" height="580" fill="#fffdfb"/>

  <g fill="none" stroke="#50331f" stroke-linecap="round" stroke-linejoin="round">
    <g transform="rotate(14 200 112)" stroke-width="9">
      <rect x="68" y="45" width="238" height="132" rx="13"/>
      <path d="M77 78h220"/>
      <rect x="90" y="99" width="41" height="31" rx="5" stroke-width="6"/>
      <path d="M91 149h35" stroke-width="7"/>
      <path d="M257 143h27" stroke-width="7"/>
    </g>
    <g transform="rotate(-1 166 131)" stroke-width="9">
